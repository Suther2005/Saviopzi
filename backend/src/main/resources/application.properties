spring.application.name=saviopzi-backend

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/saviopzi_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:suther123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
# We use 'update' so Hibernate will manage the schema updates
# but we have provided schema.sql as a design reference.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Configuration
server.port=8080

# JWT Configuration
jwt.secret=${JWT_SECRET:super_secret_key_for_jwt_saviopzi_replace_in_production}
jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}

# AI Configuration
ai.api.key=${AI_API_KEY:}
ai.api.url=${AI_API_URL:}
